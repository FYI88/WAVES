<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>WaveS</title>
    <style>
      /* In-flow, static placeholders: never cover an already usable app. */
      html, body { margin: 0; background: #f4f5f7; }
      #startup-shell { --boot-bg: #f4f5f7; --boot-ink: #11141a; --boot-muted: #4a5060; --boot-line: #dfe1e6; --boot-bone: #e1e3e8; background: var(--boot-bg); color: var(--boot-ink); font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; min-height: 100vh; min-height: 100svh; }
      #startup-shell, #startup-shell * { animation: none !important; transition: none !important; box-sizing: border-box; }
      .startup-header { display: flex; align-items: center; gap: 18px; min-height: 68px; padding: max(12px, env(safe-area-inset-top)) 20px 12px; border-bottom: 1px solid var(--boot-line); }
      .startup-header strong { font-size: 22px; letter-spacing: -.04em; }
      .startup-header .startup-bone { width: 90px; margin: 0 0 0 auto; height: 28px; }
      .startup-notice { padding: 8px 20px; border-bottom: 1px solid var(--boot-line); color: var(--boot-muted); }
      #startup-status { margin: 0; }
      #startup-retry { margin-top: 8px; min-height: 44px; padding: 8px 18px; border: 1px solid var(--boot-muted); border-radius: 6px; color: var(--boot-ink); background: var(--boot-bg); font: inherit; cursor: pointer; }
      #startup-retry:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
      .startup-grid { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "scene" "results" "controls"; }
      .startup-grid > * { min-width: 0; border-bottom: 1px solid var(--boot-line); }
      .startup-scene { grid-area: scene; display: grid; grid-template-rows: minmax(400px, 60svh) 100px; }
      .startup-drawing { margin: 24px; border: 1px solid var(--boot-line); border-radius: 4px; }
      .startup-deck { display: flex; gap: 12px; padding: 20px; border-top: 1px solid var(--boot-line); }
      .startup-deck .startup-bone { width: 28%; height: 32px; }
      .startup-results { grid-area: results; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .startup-controls { grid-area: controls; padding: 24px; }
      .startup-bone { display: block; height: 12px; width: 60%; border-radius: 4px; background: var(--boot-bone); margin-bottom: 18px; }
      .startup-bone.startup-short { width: 38%; }
      .startup-bone.startup-value { height: 34px; width: 75%; }
      .startup-bone.startup-input { height: 38px; width: 100%; margin-bottom: 28px; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0b0d12; }
        #startup-shell { --boot-bg: #0b0d12; --boot-ink: #eceef3; --boot-muted: #a6abb8; --boot-line: #272a31; --boot-bone: #242830; }
      }
      @media (min-width: 1040px) {
        .startup-grid { grid-template-columns: minmax(240px, 24%) minmax(0, 1fr) minmax(280px, 28%); grid-template-areas: "controls scene results"; }
        .startup-scene { grid-template-rows: minmax(360px, 55svh) 100px; }
        .startup-controls { border-right: 1px solid var(--boot-line); }
        .startup-results { grid-template-columns: 1fr; align-content: start; border-left: 1px solid var(--boot-line); }
      }
      @media (max-width: 639px), (max-width: 900px) and (max-height: 560px) {
        .startup-header { min-height: 56px; padding: max(6px, env(safe-area-inset-top)) 12px 6px; }
        .startup-header .startup-bone { height: 36px; width: 128px; }
      }
      @media (max-width: 900px) and (max-height: 560px) and (orientation: landscape) {
        .startup-scene { grid-template-rows: 100px minmax(320px, 84svh); }
        .startup-deck { grid-row: 1; }
      }
      /* No shimmer or spinner, including under prefers-reduced-motion. */
    </style>
  </head>
  <body>
    <div id="root" aria-busy="true"></div>
    <div id="startup-shell">
      <header class="startup-header"><strong>WaveS</strong><span class="startup-bone" aria-hidden="true"></span></header>
      <div class="startup-notice">
        <p id="startup-status" role="status" aria-live="polite">Loading simulation… / Chargement de la simulation…</p>
        <button id="startup-retry" type="button" hidden>Retry / Réessayer</button>
      </div>
      <div class="startup-grid" aria-hidden="true" aria-busy="true">
        <div class="startup-scene"><div class="startup-drawing"></div><div class="startup-deck"><span class="startup-bone"></span><span class="startup-bone"></span></div></div>
        <div class="startup-results"><div><span class="startup-bone startup-short"></span><span class="startup-bone startup-value"></span></div><div><span class="startup-bone startup-short"></span><span class="startup-bone startup-value"></span></div><div><span class="startup-bone"></span><span class="startup-bone startup-value"></span></div></div>
        <div class="startup-controls"><span class="startup-bone startup-short"></span><span class="startup-bone startup-input"></span><span class="startup-bone startup-short"></span><span class="startup-bone startup-input"></span><span class="startup-bone"></span><span class="startup-bone startup-input"></span></div>
      </div>
    </div>
    <noscript><style>#startup-shell { display: none; }</style><p>Enable JavaScript to use WaveS. / Activez JavaScript pour utiliser WaveS.</p></noscript>
    <!-- Classic, local bootstrap also handles an entry-module network failure. -->
    <script src="./startup.js"></script>
    <!-- Independent of both external scripts: a missing bootstrap must be recoverable. -->
    <script id="startup-fallback">
      (function () {
        if (!window.wavesStartup) {
          var status = document.getElementById("startup-status");
          var retry = document.getElementById("startup-retry");
          if (status) status.textContent = "WaveS could not start. Retry loading the app. / Impossible de démarrer WaveS. Réessayez de charger l’application.";
          if (retry) {
            retry.hidden = false;
            retry.onclick = function () { window.location.reload(); };
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
