name: Android signed APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: WAVES

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WAVES/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"
          accept-android-sdk-licenses: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Web build
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WAVES_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure permanent WAVES signing secrets before building release APKs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waves-release.jks"
          chmod 600 "$RUNNER_TEMP/waves-release.jks"

      - name: Build signed release APK
        working-directory: WAVES/android
        env:
          WAVES_STORE_FILE: ${{ runner.temp }}/waves-release.jks
          WAVES_STORE_PASSWORD: ${{ secrets.WAVES_STORE_PASSWORD }}
          WAVES_KEY_ALIAS: ${{ secrets.WAVES_KEY_ALIAS }}
          WAVES_KEY_PASSWORD: ${{ secrets.WAVES_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt 10485760 ]; then
            echo "::error::APK is larger than the 10 MB budget ($SIZE bytes)"
            exit 1
          fi

      - name: Report APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          {
            echo "### Signed release APK"
            echo ""
            echo "- Size: $(du -h "$APK" | cut -f1)"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: $(node -p "require('./package.json').version")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: waves-release-apk
          path: WAVES/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/waves-release.jks"
