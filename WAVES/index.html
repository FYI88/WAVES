<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>WaveS</title>
    <style>
      /* ── Splash: text-only boot screen, removed once React mounts ── */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; background: #080e17; color: #edf4fc;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        transition: opacity .35s ease;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash .sp-kicker { font-size: 11px; letter-spacing: .35em; color: #94a6bc; }
      #splash .sp-name { font-size: 44px; font-weight: 800; letter-spacing: .04em; }
      #splash .sp-name span { color: #55dbf5; }
      #splash .sp-sub { font-size: 13px; color: #b4c3d5; }
      #splash .sp-bar { width: 168px; height: 2px; margin-top: 14px; background: #253447; overflow: hidden; border-radius: 2px; }
      #splash .sp-bar i { display: block; height: 100%; width: 40%; background: #55dbf5; border-radius: 2px; animation: sp-slide 1.1s ease-in-out infinite; }
      @keyframes sp-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(420%); } }
      #splash .sp-credit { position: absolute; bottom: 22px; font-size: 11px; letter-spacing: .12em; color: #94a6bc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="sp-kicker">ENSA · GSR1</div>
      <div class="sp-name">Wave<span>S</span></div>
      <div class="sp-sub">Wave &amp; Wall Simulator</div>
      <div class="sp-bar"><i></i></div>
      <div class="sp-credit">RÉALISÉ PAR CHETAINE YOUNES</div>
    </div>
    <script>
      // Remove the splash once React has mounted; hard fallback after 8s.
      (function () {
        var t0 = Date.now();
        function hide() {
          var el = document.getElementById("splash");
          if (!el || el.classList.contains("done")) return;
          el.classList.add("done");
          setTimeout(function () { el.remove(); }, 400);
        }
        (function wait() {
          var mounted = document.getElementById("root") && document.getElementById("root").children.length > 0;
          if (mounted && Date.now() - t0 > 700) { hide(); return; }
          if (Date.now() - t0 > 8000) { hide(); return; }
          setTimeout(wait, 60);
        })();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
